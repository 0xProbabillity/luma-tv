name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Android SDK
        run: |
          export ANDROID_SDK_ROOT="$HOME/android-sdk"; echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          # Pin by checksum when you adopt this workflow; the version number below changes over time.
          curl -fsSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/clt.zip -d "$ANDROID_SDK_ROOT/cmdline-tools" && mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" "platforms;android-34"
      - run: sudo apt-get install -y junit4 shellcheck shfmt libxml2-utils
      - run: ./tools/lint.sh
      - run: ./build.sh debug && ./build.sh release && ./build.sh offline
      - run: ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/android-34/android.jar" ./test/run.sh
      - uses: actions/upload-artifact@v4
        with: { name: apks, path: dist/*.apk }
